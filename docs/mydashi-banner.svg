<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">MyDashi</title>
  <desc id="desc">Your day, at a glance. A morning board with a briefing, calendar, tasks, and mail.</desc>
  <defs>
    <linearGradient id="brief" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="480" rx="28" fill="#0a0f1c"/>
  <circle cx="-30" cy="-40" r="200" fill="#4f46e5" opacity="0.28"/>
  <circle cx="1160" cy="520" r="220" fill="#7c3aed" opacity="0.22"/>

  <rect x="40" y="40" width="52" height="52" rx="14" fill="url(#mark)"/>
  <path d="M56 66h8l6-10 6 16 5-8h11" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="78" cy="58" r="2.2" fill="#fff"/>

  <text x="108" y="73" fill="#e8edf5" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="26" font-weight="700">MyDashi</text>

  <rect x="40" y="116" width="196" height="28" rx="14" fill="#1e1b4b"/>
  <text x="138" y="135" text-anchor="middle" fill="#a5b4fc" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="12" font-weight="650">Smart morning briefing</text>

  <text x="40" y="206" fill="#e8edf5" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="42" font-weight="750">Your day,</text>
  <text x="40" y="258" fill="#a5b4fc" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="42" font-weight="750">at a glance.</text>

  <text x="40" y="312" fill="#94a3b8" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="16">Calendar, tasks, and mail, folded into</text>
  <text x="40" y="336" fill="#94a3b8" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="16">one board you can rearrange.</text>

  <rect x="40" y="372" width="92" height="30" rx="15" fill="#111827" stroke="#1e293b"/>
  <text x="86" y="392" text-anchor="middle" fill="#e8edf5" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="12" font-weight="600">English</text>
  <rect x="142" y="372" width="86" height="30" rx="15" fill="#111827" stroke="#1e293b"/>
  <text x="185" y="392" text-anchor="middle" fill="#e8edf5" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13" font-weight="600">&#x05E2;&#x05D1;&#x05E8;&#x05D9;&#x05EA;</text>
  <rect x="238" y="372" width="118" height="30" rx="15" fill="#111827" stroke="#1e293b"/>
  <text x="297" y="392" text-anchor="middle" fill="#e8edf5" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="12" font-weight="600">Light &amp; dark</text>

  <rect x="548" y="32" width="532" height="416" rx="22" fill="#0f172a" stroke="#1e293b"/>

  <rect x="572" y="56" width="484" height="118" rx="16" fill="url(#brief)"/>
  <circle cx="980" cy="56" r="48" fill="#ffffff" opacity="0.12"/>
  <text x="592" y="86" fill="#ffffff" fill-opacity="0.75" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="0.4">MORNING BRIEFING</text>
  <text x="592" y="116" fill="#ffffff" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="15">Three meetings this morning, four open tasks,</text>
  <text x="592" y="140" fill="#ffffff" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="15">and two important emails waiting.</text>

  <rect x="572" y="192" width="152" height="228" rx="14" fill="#111827" stroke="#1e293b"/>
  <rect x="588" y="208" width="26" height="26" rx="8" fill="#1e1b4b"/>
  <path d="M595 221h12M597 218v8M605 218v8M595 224h12v6h-12z" fill="none" stroke="#a5b4fc" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="622" y="226" fill="#e8edf5" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13" font-weight="700">Calendar</text>
  <text x="588" y="268" fill="#64748b" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="12">09:00</text>
  <text x="632" y="268" fill="#cbd5e1" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="12">Team sync</text>
  <text x="588" y="296" fill="#64748b" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="12">11:30</text>
  <text x="632" y="296" fill="#cbd5e1" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="12">Client call</text>

  <rect x="736" y="192" width="152" height="228" rx="14" fill="#111827" stroke="#1e293b"/>
  <rect x="752" y="208" width="26" height="26" rx="8" fill="#052e26"/>
  <path d="M759 221l4 4 8-9" fill="none" stroke="#6ee7b7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="786" y="226" fill="#e8edf5" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13" font-weight="700">Tasks</text>
  <circle cx="760" cy="264" r="4" fill="none" stroke="#64748b" stroke-width="1.3"/>
  <text x="772" y="268" fill="#cbd5e1" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11">Send the proposal</text>
  <circle cx="760" cy="292" r="4" fill="none" stroke="#64748b" stroke-width="1.3"/>
  <text x="772" y="296" fill="#cbd5e1" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11">Update the report</text>

  <rect x="900" y="192" width="156" height="228" rx="14" fill="#111827" stroke="#1e293b"/>
  <rect x="916" y="208" width="26" height="26" rx="8" fill="#40200a"/>
  <path d="M923 218h12v8h-12zM923 218l6 4 6-4" fill="none" stroke="#fcd34d" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="950" y="226" fill="#e8edf5" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13" font-weight="700">Mail</text>
  <circle cx="924" cy="264" r="3" fill="#fcd34d"/>
  <text x="934" y="268" fill="#cbd5e1" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="12">Project update</text>
  <circle cx="924" cy="292" r="3" fill="#fcd34d"/>
  <text x="934" y="296" fill="#cbd5e1" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="12">Confirmation</text>
</svg>
